[build-system]
requires = ["scikit-build-core>=0.5.0", "nanobind>=1.9.0"]
build-backend = "scikit_build_core.build"

[project]
name = "qfold"
version = "0.1.0"
description = "Demo App of Lattice Protein Folding Models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "LICENSE"}
dependencies = [
    "typer>=0.9.0",
    "textual>=0.40.0",
    "rich>=13.0.0",
    "lattpy>=0.1.0",
    "numpy>=1.20.0",
]

[project.scripts]
qfold = "qfold.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.scikit-build]
build-dir = "build"
wheel.packages = ["qfold"]

[tool.ruff]
line-length = 80
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []
# E501 (line too long) is enabled via "E" rules above
# Use 'ruff format' to auto-fix line length violations

[tool.ruff.lint.isort]
known-first-party = ["qfold"]

[tool.ruff.format]
# Use the same line length as linting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# Filter warnings from third-party libraries
# NOTE: The following filter suppresses deprecation warnings from the
# lattpy library related to NumPy 2.0 compatibility. These warnings are
# generated by lattpy's internal code (specifically in lattpy/spatial.py)
# when using 2-dimensional vectors with np.cross(). This is a known issue
# with lattpy and NumPy 2.0 compatibility, not a problem with our code.
# The functionality still works correctly despite these warnings.
# See: https://github.com/dylanljones/lattpy/issues
filterwarnings = [
    "ignore:.*2-dimensional vectors.*deprecated.*:DeprecationWarning:lattpy.spatial",
]

